<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Outer Gold Ring -->
  <circle cx="50" cy="50" r="48" fill="#f59e0b" stroke="#b45309" stroke-width="1.5" />
  <circle cx="50" cy="50" r="44" fill="#1e293b" />
  
  <!-- Blue Top Semi-circle / Shield Background -->
  <path d="M 50,8 A 42,42 0 0,1 92,50 L 8,50 A 42,42 0 0,1 50,8 Z" fill="#0038a8" />
  
  <!-- Red Bottom Semi-circle -->
  <path d="M 8,50 L 92,50 A 42,42 0 0,1 50,92 A 42,42 0 0,1 8,50 Z" fill="#ce1126" />
  
  <!-- Inner Rim Border -->
  <circle cx="50" cy="50" r="42" fill="none" stroke="#fcd116" stroke-width="1" />
  
  <!-- Central White Oval Ring / Border -->
  <circle cx="50" cy="50" r="23" fill="#002b7f" stroke="#fcd116" stroke-width="1.2" />
  
  <!-- Golden 8-Ray Sun -->
  <g fill="#fcd116">
    <!-- Center disk -->
    <circle cx="50" cy="50" r="9" />
    <!-- 8 Main Pointed Rays -->
    <polygon points="50,29 48,39 52,39" />
    <polygon points="50,71 48,61 52,61" />
    <polygon points="29,50 39,48 39,52" />
    <polygon points="71,50 61,48 61,52" />
    <polygon points="35.15,35.15 40.8,43.6 43.6,40.8" />
    <polygon points="64.85,64.85 59.2,56.4 56.4,59.2" />
    <polygon points="64.85,35.15 56.4,40.8 59.2,43.6" />
    <polygon points="35.15,64.85 43.6,59.2 40.8,56.4" />
    <!-- Subtle Minor Rays -->
    <circle cx="50" cy="38" r="1.5" />
    <circle cx="50" cy="62" r="1.5" />
    <circle cx="38" cy="50" r="1.5" />
    <circle cx="62" cy="50" r="1.5" />
  </g>
  
  <!-- Three Golden Stars (Luzon, Visayas, Mindanao) -->
  <!-- Top Star -->
  <polygon points="50,11.5 51.5,15.5 55.5,15.5 52.3,18 53.5,22 50,19.5 46.5,22 47.7,18 44.5,15.5 48.5,15.5" fill="#fcd116" />
  <!-- Bottom-Left Star -->
  <polygon points="20,74 21.5,78 25.5,78 22.3,80.5 23.5,84.5 20,82 16.5,84.5 17.7,80.5 14.5,78 18.5,78" fill="#fcd116" />
  <!-- Bottom-Right Star -->
  <polygon points="80,74 81.5,78 85.5,78 82.3,80.5 83.5,84.5 80,82 76.5,84.5 77.7,80.5 74.5,78 78.5,78" fill="#fcd116" />
  
  <!-- Outer Gold Beaded Trim -->
  <circle cx="50" cy="50" r="47.5" fill="none" stroke="#fcd116" stroke-width="0.8" stroke-dasharray="1.5, 2.5" />
</svg>
